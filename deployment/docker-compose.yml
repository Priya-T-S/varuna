# VARUNA AI — local/dev orchestration.
# Usage (from repo root):  docker compose -f deployment/docker-compose.yml up --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-varuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varuna}
      POSTGRES_DB: ${POSTGRES_DB:-varuna_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applies the initial schema on first start only.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varuna} -d ${POSTGRES_DB:-varuna_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-varuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varuna}
      POSTGRES_DB: ${POSTGRES_DB:-varuna_ai}
      USE_POSTGRES: "true"
      GEO_DATA_DIR: /data/geo
      # What-if assistant + alert channels: values come from the shell or a .env next to this file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - ../data/geo:/data/geo:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
